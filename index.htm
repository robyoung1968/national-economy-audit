<script>
    let economyData = [];
    const percentFormat = new Intl.NumberFormat('en-US', { style: 'percent', minimumFractionDigits: 1 });

    async function init() {
        try {
            const response = await fetch('economic_data.json');
            economyData = await response.json();
            
            const selector = document.getElementById('date-select');
            
            // Only show dates from Jan 2009 (Obama start) to present in the dropdown
            const displayData = economyData.filter(row => new Date(row.month_date) >= new Date('2009-01-01'));
            
            displayData.forEach(row => {
                const opt = document.createElement('option');
                opt.value = row.month_date;
                opt.textContent = new Date(row.month_date + 'T00:00:00').toLocaleDateString('en-US', {month:'long', year:'numeric'});
                selector.appendChild(opt);
            });

            if (displayData.length > 0) updateDashboard(displayData[0].month_date);

        } catch (e) {
            console.error("Error:", e);
        }
    }

    function updateDashboard(selectedDate) {
        const idx = economyData.findIndex(r => r.month_date === selectedDate);
        if (idx === -1) return;
        const current = economyData[idx];

        // 1. Debt in Trillions
        const debtTrillions = current.avg_monthly_debt / 1_000_000_000_000;
        document.getElementById('debt-val').textContent = (debtTrillions > 0) ? "$" + debtTrillions.toFixed(2) + "T" : "N/A";
        
        // 2. Inflation (YoY) - This will now work for 2009 because 2008 data is in economyData
        const yearAgo = economyData[idx + 12];
        if (yearAgo && yearAgo.cpi_index) {
            const yoy = (current.cpi_index - yearAgo.cpi_index) / yearAgo.cpi_index;
            document.getElementById('inflation-val').textContent = percentFormat.format(yoy);
        } else {
            document.getElementById('inflation-val').textContent = "N/A";
        }
        document.getElementById('cpi-sub').textContent = "CPI Index: " + current.cpi_index.toFixed(1);

        // 3. Unemployment
        document.getElementById('u3-val').textContent = current.u3_rate.toFixed(1) + "%";
        document.getElementById('u6-val').textContent = current.u6_rate.toFixed(1) + "%";
    }

    init();
</script>
