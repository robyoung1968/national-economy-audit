name: Auto-update economic data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grants explicit write permissions to commit changes back to repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Monthly Audit
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_audit.py

      - name: Run Annual Audit
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_annual_audit.py

      - name: Commit and Push Updated Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # Force a baseline change to track the execution boundary
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_updated.txt
          
          # Explicitly stage the precise pipeline assets produced by your scripts
          git add economic_data.json economic_data.csv last_updated.txt
          
          # Safely stage optional annual metrics if produced by your secondary pipeline
          git add --ignore-errors annual_data.json annual_data.csv
          
          if git diff-index --quiet HEAD --; then
            echo "No telemetry modifications detected. Skipping deployment commit."
          else
            git commit -m "data: monthly pipeline update via FRED macro series"
            git push
          fi
