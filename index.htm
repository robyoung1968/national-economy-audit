<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Economy Audit Dashboard</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --border: #334155; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: system-ui, sans-serif; margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        header { text-align: center; margin-bottom: 2rem; width: 100%; max-width: 1000px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; width: 100%; max-width: 1000px; }
        .card { background: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); position: relative; }
        .card-label { color: var(--text-muted); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
        .card-value { font-size: 2rem; font-weight: 700; color: var(--accent); margin-bottom: 0.5rem; }
        .card-subtext { color: var(--text-muted); font-size: 0.75rem; }
        .nav-link { margin-top: 3rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
        .nav-link:hover { color: var(--accent); border-color: var(--accent); }
    </style>
</head>
<body>

<header>
    <h1>National Economy Audit</h1>
    <p style="color: var(--text-muted)">Monthly Performance Indicators</p>
</header>

<div class="grid">
    <div class="card">
        <div class="card-label">Total National Debt</div>
        <div id="debt-val" class="card-value">Loading...</div>
        <div id="debt-sub" class="card-subtext">--</div>
    </div>

    <div class="card">
        <div class="card-label">Unemployment (U3)</div>
        <div id="u3-val" class="card-value">--</div>
        <div id="u3-sub" class="card-subtext">Official Rate</div>
    </div>

    <div class="card">
        <div class="card-label">Real Unemployment (U6)</div>
        <div id="u6-val" class="card-value">--</div>
        <div id="u6-sub" class="card-subtext">Includes Underemployed</div>
    </div>

    <div class="card">
        <div class="card-label">CPI Inflation Index</div>
        <div id="cpi-val" class="card-value">--</div>
        <div id="cpi-sub" class="card-subtext">Index Value</div>
    </div>
</div>

<a href="annual.html" class="nav-link">VIEW ANNUAL AUDIT (GDP & TRADE) →</a>

<script>
    const currencyFormat = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
    const percentFormat = new Intl.NumberFormat('en-US', { style: 'percent', minimumFractionDigits: 1 });

    async function loadData() {
        try {
            const response = await fetch('economic_data.json');
            const data = await response.json();
            const current = data[0]; // Take the latest record

            document.getElementById('debt-val').textContent = currencyFormat.format(current.avg_monthly_debt);
            document.getElementById('debt-sub').textContent = "As of " + current.month_date;
            
            document.getElementById('u3-val').textContent = percentFormat.format(current.u3_rate);
            document.getElementById('u6-val').textContent = percentFormat.format(current.u6_rate);
            
            document.getElementById('cpi-val').textContent = current.cpi_index.toFixed(1);
            document.getElementById('cpi-sub').textContent = "Ref: " + current.month_date;

        } catch (e) {
            console.error("Load error:", e);
        }
    }
    loadData();
</script>
</body>
</html>
