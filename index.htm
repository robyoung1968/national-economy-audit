<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Economy Audit Dashboard</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --border: #334155; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: system-ui, sans-serif; margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        header { text-align: center; margin-bottom: 2rem; width: 100%; max-width: 1000px; }
        .controls { background: var(--card-bg); padding: 1rem 2rem; border-radius: 12px; display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; border: 1px solid var(--border); }
        select { background: var(--bg-color); color: var(--text-main); border: 1px solid #475569; padding: 0.5rem 1rem; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; width: 100%; max-width: 1000px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 1.5rem; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .card-title { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
        .card-value { font-size: 1.8rem; font-weight: 700; color: var(--text-main); }
        .card-subtext { font-size: 0.8rem; color: var(--accent); margin-top: 0.5rem; }
    </style>
</head>
<body>

<header>
    <h1>National Economy Audit</h1>
    <p style="color: var(--text-muted);">Interactive Macroeconomic Monitoring System</p>
</header>

<div class="controls">

</div>

    <div class="card">

        <div id="cpi-sub" class="card-subtext">CPI Index: --</div>
    </div>
    <div class="card">
        <div class="card-title">Unemployment (U3)</div>
        <div id="u3-val" class="card-value">--</div>
        <div class="card-subtext">Official Metric</div>
    </div>
    <div class="card">
        <div class="card-title">Unemployment (U6)</div>
        <div id="u6-val" class="card-value">--</div>
        <div class="card-subtext">Broad Rate</div>
    </div>
</div>

</body>
</html>
