name: Auto-update economic data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Monthly Audit
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_audit.py

      - name: Run Annual Audit
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_annual_audit.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add economic_data.json annual_data.json
          git commit -m "data: automated monthly and annual update" || exit 0
          git push origin main
