<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>National Economy Audit - Phase 2</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .container { width: 80%; margin: auto; }
        .chart-box { margin-bottom: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Economic Indicators Dashboard</h1>
        
        <div class="chart-box">
            <canvas id="gdpChart"></canvas>
        </div>

        <div class="chart-box">
            <canvas id="tradeChart"></canvas>
        </div>
    </div>

    <script>
       async function loadDashboard() {
    try {
        // Step 1: Fetch the correct filename
        const response = await fetch('economic_data.json'); 
        if (!response.ok) throw new Error(`Could not find economic_data.json`);
        
        const rawData = await response.json();

        // Step 2: Drill into the 'data' key defined in Python
        const records = rawData.data; 

        // Step 3: Map the record_date and metrics
        const labels = records.map(entry => entry.record_date);
        const gdpData = records.map(entry => entry.real_gdp ?? 0);
        const tradeData = records.map(entry => entry.net_exports ?? 0);

        // ... rest of Chart.js logic

                // GDP Chart
                new Chart(document.getElementById('gdpChart'), {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'GDP Growth (%)',
                            data: gdpData,
                            borderColor: 'rgb(75, 192, 192)',
                            tension: 0.1
                        }]
                    }
                });

                // Trade Balance Chart
                new Chart(document.getElementById('tradeChart'), {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Trade Balance (USD)',
                            data: tradeData,
                            backgroundColor: 'rgba(255, 99, 132, 0.5)',
                            borderColor: 'rgb(255, 99, 132)',
                            borderWidth: 1
                        }]
                    }
                });

            } catch (error) {
                console.error("Error loading or parsing JSON:", error);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
