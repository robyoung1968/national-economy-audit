name: Auto-update economic data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Restricts write access exclusively to this specific runner job
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Monthly Audit
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_audit.py

      - name: Run Annual Audit
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_annual_audit.py

      - name: Run Economic Audit Scraping Pipeline
        run: python run_audit.py

      - name: Generate Executive CSV Fallbacks
        run: |
          python convert_monthly.py
          python convert_annual.py

      - name: Commit and Push Updated Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add economic_data.json annual_data.json *.csv
          # The fix: wrapping the commit in an if-statement ensures the pipeline turns green even if data hasn't changed
          if git diff-index --quiet HEAD --; then
            echo "No telemetry modifications detected. Skipping deployment commit."
          else
            git commit -m "data: pipeline auto-update JSON and CSV telemetry matrices"
            git push
          fi
