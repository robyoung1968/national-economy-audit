name: Auto-update economic data

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows you to run it manually for testing

permissions:
  contents: write # Crucial for allowing the bot to push the JSON update

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Audit Script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_audit.py

      - name: Commit and Push if JSON changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add economic_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "data: automated economic data update" && git push)
