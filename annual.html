<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>National Economy Audit | Annual Data</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root { 
            --bg-color: #0f172a; 
            --card-bg: #1e293b; 
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
            --accent: #38bdf8; 
            --border: #334155; 
            --success: #10b981;
            --danger: #ef4444;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 2rem; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        header { text-align: center; margin-bottom: 2rem; width: 100%; max-width: 1200px; }
        .controls { 
            background: var(--card-bg); 
            padding: 1rem 2rem; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            gap: 1rem; 
            margin-bottom: 2rem; 
            border: 1px solid var(--border); 
        }
        select { 
            background: var(--bg-color); 
            color: var(--text-main); 
            border: 1px solid #475569; 
            padding: 0.5rem 1rem; 
            border-radius: 6px; 
            font-size: 1rem; 
            cursor: pointer; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 1.5rem; 
            width: 100%; 
            max-width: 1200px; 
            margin-bottom: 2rem; 
        }
        .card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            padding: 1.5rem; 
            border: 1px solid var(--border); 
        }
        .card-title { 
            color: var(--text-muted); 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            margin-bottom: 0.75rem; 
        }
        .card-value { font-size: 1.8rem; font-weight: 700; color: var(--text-main); }
        .card-subtext { font-size: 0.85rem; color: var(--accent); margin-top: 0.5rem; }
          
        .viz-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
            gap: 1.5rem; 
            width: 100%; 
            max-width: 1200px; 
        }
        .chart-card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            padding: 1.5rem; 
            border: 1px solid var(--border); 
            height: 380px;            
            min-height: 380px; 
            box-sizing: border-box;   
            position: relative;       
        }
        .chart-card canvas {
            max-height: 100% !important;
            width: 100% !important;
        }
        .chart-card.wide { 
            grid-column: span 1; 
            height: 650px;       /* Elongated container to 650px (Approach 1) to grant bars vertical breathing room */
            min-height: 650px;
        }
        @media (min-width: 900px) { .chart-card.wide { grid-column: span 2; } }
        .disclaimer { 
            max-width: 1200px; 
            width: 100%; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin-top: 1.5rem; 
            text-align: center; 
            display: none; 
            padding: 0.5rem; 
        }
        .nav-link { 
            margin-top: 3rem; 
            color: var(--text-muted); 
            text-decoration: none; 
            font-size: 0.9rem; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 4px; 
            transition: color 0.2s;
        }
        .nav-link:hover { color: var(--accent); }
    </style>
</head>
<body>

<header>
    <h1 id="page-title">Annual Economic Audit</h1>
    <p style="color: var(--text-muted);">Macro Perspective: GDP & Trade Balance Matrix</p>
</header>

<div class="controls">
    <label for="year-select">Select Audit Year:</label>
    <select id="year-select" onchange="updateDashboard(this.value)"></select>
</div>

<div class="grid">
    <div class="card">
        <div class="card-title">Nominal GDP</div>
        <div id="gdp-val" class="card-value">--</div>
        <div id="gdp-growth" class="card-subtext">Annual Real Change: --</div>
    </div>
    <div class="card">
        <div class="card-title">Trade Balance (Total)</div>
        <div id="trade-val" class="card-value">--</div>
        <div id="trade-breakdown" class="card-subtext">--</div>
    </div>
</div>

<div class="viz-grid">
    <div class="chart-card">
        <div class="chart-title">Nominal GDP Trend (Trillions)</div>
        <canvas id="chart-gdp-nominal"></canvas>
    </div>
    <div class="chart-card">
        <div class="chart-title">Real GDP Headline Growth Rate</div>
        <canvas id="chart-gdp-growth"></canvas>
    </div>
    <div class="chart-card wide">
        <div class="chart-title">Trade Balance Matrix Component Breakdown (Billions)</div>
        <canvas id="chart-trade-matrix"></canvas>
    </div>
</div>

<div id="annualization-disclaimer" class="disclaimer"></div>

<a href="index.htm" class="nav-link">← BACK TO MONTHLY DASHBOARD</a>

<script>
    let annualData = [];
    let chartGdpNominal, chartGdpGrowth, chartTradeMatrix;
    const percentFormat = new Intl.NumberFormat('en-US', { style: 'percent', minimumFractionDigits: 1 });

    const chartStyleDefaults = {
        color: '#94a3b8',
        borderColor: '#334155',
        fontFamily: 'system-ui, sans-serif',
        gridColor: 'rgba(51, 65, 85, 0.4)'
    };

    Chart.register(ChartDataLabels);

    async function init() {
        try {
            const response = await fetch(`annual_data.json?v=${new Date().getTime()}`);
            annualData = await response.json();
            
            annualData.sort((a, b) => parseInt(a.year) - parseInt(b.year));

            const selector = document.getElementById('year-select');
            const displayData = annualData.filter(row => parseInt(row.year) >= 2009);
            
            [...displayData].reverse().forEach(row => {
                const opt = document.createElement('option');
                opt.value = row.year;
                opt.textContent = row.year;
                selector.appendChild(opt);
            });

            buildCharts(displayData);

            if (displayData.length > 0) {
                updateDashboard(displayData[displayData.length - 1].year);
            }
        } catch (e) { console.error("Data Initialization Error:", e); }
    }

    function buildCharts(dataset) {
        const labels = dataset.map(row => row.year);
        
        // --- CHART 1: NOMINAL GDP (AREA) ---
        const ctxGdp = document.getElementById('chart-gdp-nominal').getContext('2d');
        chartGdpNominal = new Chart(ctxGdp, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Nominal GDP',
                    data: dataset.map(row => row.gdp_nominal / 1000),
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.1)',
                    fill: true,
                    tension: 0.15,
                    borderWidth: 2.5
                }]
            },
            options: {
                ...getBaseChartOptions(false, 'T'),
                plugins: {
                    ...getBaseChartOptions(false, 'T').plugins,
                    legend: { display: false },
                    tooltip: {
                        padding: 10,
                        cornerRadius: 8,
                        callbacks: {
                            label: function(context) {
                                let value = context.parsed.y;
                                // Injects explicit padding space between the colored status square and string label literal
                                return ' Nominal GDP: $' + value.toFixed(2) + 'T';
                            }
                        }
                    },
                    datalabels: { display: false } 
                }
            }
        });

        // --- CHART 2: REAL GROWTH RATE (BAR) ---
        const ctxGrowth = document.getElementById('chart-gdp-growth').getContext('2d');
        chartGdpGrowth = new Chart(ctxGrowth, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Real Growth Rate',
                    data: dataset.map(row => row.gdp_growth_real * 100),
                    backgroundColor: dataset.map(row => row.gdp_growth_real >= 0 ? 'rgba(56, 189, 248, 0.75)' : 'rgba(239, 68, 68, 0.75)'),
                    borderRadius: 4
                }]
            },
            options: {
                ...getBaseChartOptions(true, '%'),
                plugins: {
                    ...getBaseChartOptions(true, '%').plugins,
                    legend: { display: false },
                    tooltip: {
                        padding: 10,
                        cornerRadius: 8,
                        callbacks: {
                            label: function(context) {
                                let value = context.parsed.y;
                                // Spaces icon and forces 1-decimal-point format parsing
                                return ' Real Growth Rate: ' + value.toFixed(1) + '%';
                            }
                        }
                    },
                    datalabels: { display: false } 
                }
            }
        });

        // --- CHART 3: COMBO MATRIX TRADE BALANCE ---
        const ctxTrade = document.getElementById('chart-trade-matrix').getContext('2d');
        chartTradeMatrix = new Chart(ctxTrade, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        type: 'line',
                        label: 'Total Net Balance',
                        data: dataset.map(row => row.trade_total),
                        borderColor: '#38bdf8',
                        borderWidth: 3,
                        pointBackgroundColor: '#38bdf8',
                        fill: false,
                        tension: 0.1,
                        order: 1,
                        datalabels: { display: false } 
                    },
                    {
                        label: 'Goods Balance',
                        data: dataset.map(row => row.trade_goods),
                        backgroundColor: 'rgba(239, 68, 68, 0.75)',
                        borderColor: '#ef4444',
                        borderWidth: 1,
                        borderRadius: 4,
                        order: 2
                    },
                    {
                        label: 'Services Balance',
                        data: dataset.map(row => row.trade_services),
                        backgroundColor: 'rgba(16, 185, 129, 0.75)',
                        borderColor: '#10b981',
                        borderWidth: 1,
                        borderRadius: 4,
                        order: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { top: 20, bottom: 5 } },
                plugins: {
                    legend: {
                        position: 'bottom',
                        align: 'start', 
                        labels: { 
                            color: chartStyleDefaults.color, 
                            font: { family: chartStyleDefaults.fontFamily, size: 12.5 } 
                        }
                    },
                    tooltip: { 
                        padding: 10, 
                        cornerRadius: 8,
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                let value = context.parsed.y;
                                const prefix = value >= 0 ? '$' : '-$';
                                // Spaces label block and limits mouseover inspection to exactly 3 decimal points ($valueB)
                                return ' ' + label + ': ' + prefix + Math.abs(value).toFixed(3) + 'B';
                            }
                        }
                    },
                    datalabels: {
                        color: '#f8fafc',
                        font: { weight: 'bold', size: 9 },
                        rotation: -90, 
                        anchor: 'center',
                        align: 'center', 
                        formatter: function(value) {
                            const prefix = value >= 0 ? '$' : '-$';
                            // Formats on-bar text strings to standard institutional $valueB rules (rounding to whole values for readability)
                            return prefix + Math.abs(Math.round(value)).toLocaleString() + 'B';
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { color: chartStyleDefaults.gridColor },
                        ticks: { color: chartStyleDefaults.color, font: { family: chartStyleDefaults.fontFamily } }
                    },
                    y: {
                        grid: { color: chartStyleDefaults.gridColor },
                        ticks: {
                            color: chartStyleDefaults.color,
                            font: { family: chartStyleDefaults.fontFamily },
                            callback: (value) => (value >= 0 ? '$' : '-$') + Math.abs(value).toLocaleString() + 'B'
                        }
                    }
                }
            }
        });
    }

    function getBaseChartOptions(isPercent, suffix) {
        return {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { labels: { color: chartStyleDefaults.color, font: { family: chartStyleDefaults.fontFamily } } },
                tooltip: { padding: 10, cornerRadius: 8 }
            },
            scales: {
                x: {
                    grid: { color: chartStyleDefaults.gridColor },
                    ticks: { color: chartStyleDefaults.color, font: { family: chartStyleDefaults.fontFamily } }
                },
                y: {
                    grid: { color: chartStyleDefaults.gridColor },
                    ticks: {
                        color: chartStyleDefaults.color,
                        font: { family: chartStyleDefaults.fontFamily },
                        callback: function(value) {
                            if (isPercent) return value.toFixed(1) + suffix;
                            return (value >= 0 ? '$' : '-$') + Math.abs(value).toLocaleString() + suffix;
                        }
                    }
                }
            }
        };
    }

    function updateDashboard(selectedYear) {
        const idx = annualData.findIndex(row => row.year === selectedYear);
        if (idx === -1) return;

        const current = annualData[idx];
        const currentRealYear = new Date().getFullYear().toString();

        const titleElement = document.getElementById('page-title'); 
        const disclaimerDiv = document.getElementById('annualization-disclaimer');

        if (current.year === currentRealYear) {
            titleElement.textContent = current.year + " (YTD) Annual Economic Audit";
            disclaimerDiv.textContent = `Note: ${current.year} components are linearly annualized from raw YTD datasets to match seasonally adjusted aggregate series run-runs.`;
            disclaimerDiv.style.display = 'block';
        } else {
            titleElement.textContent = current.year + " Annual Economic Audit";
            disclaimerDiv.style.display = 'none';
        }

        // Expanded metric display block inside KPI card component to exactly 3 decimal points
        const gdpVal = current.gdp_nominal >= 1000 ? 
            "$" + (current.gdp_nominal / 1000).toFixed(3) + " Trillion" : 
            "$" + current.gdp_nominal.toLocaleString() + " Billion";
        document.getElementById('gdp-val').textContent = gdpVal;
        document.getElementById('gdp-growth').textContent = "Annual Real Change: " + percentFormat.format(current.gdp_growth_real);

        const total = current.trade_total;
        const goods = current.trade_goods;
        const services = current.trade_services;

        document.getElementById('trade-val').textContent = (total < 0 ? "-$" : "$") + Math.abs(total).toLocaleString() + " Billion";
        const formatSub = (val) => (val < 0 ? "-$" : "+$") + Math.abs(val).toLocaleString() + "B";
        
        document.getElementById('trade-breakdown').innerHTML = 
            `Goods: <span style="color:${goods < 0 ? '#f87171' : '#4ade80'}">${formatSub(goods)}</span> | ` +
            `Services: <span style="color:${services < 0 ? '#f87171' : '#4ade80'}">${formatSub(services)}</span>`;
    }

    init();
</script>
</body>
</html>
