# FILE: .github/workflows/main.yml
# DESCRIPTION: Orchestrates the daily data pipeline for the National Economy Dashboard.
# AUTHOR: Rob Young
# 
# WORKFLOW LOGIC:
# 1. Triggers daily to pull latest Treasury and FRED data via 'run_audit.py'.
# 2. Authenticates via Service Account JSON stored in GitHub Secrets.
# 3. Updates BigQuery staging tables using WRITE_TRUNCATE to ensure data freshness.
# 4. Acts as the primary engine for the Looker Studio data source.

name: National Economy Data Refresh

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas google-cloud-bigquery pandas-gbq requests db-dtypes pyarrow

      - name: Run Ingestor
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          ls -F
          python ./run_audit.py

      - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add economic_data.json
        git commit -m "Auto-update economic data" || echo "No changes to commit"
        git push
