<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>National Economy Audit | Annual Data</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --border: #334155; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: system-ui, sans-serif; margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        header { text-align: center; margin-bottom: 2rem; width: 100%; max-width: 1000px; }
        .controls { background: var(--card-bg); padding: 1rem 2rem; border-radius: 12px; display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; border: 1px solid var(--border); }
        select { background: var(--bg-color); color: var(--text-main); border: 1px solid #475569; padding: 0.5rem 1rem; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; width: 100%; max-width: 1000px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 1.5rem; border: 1px solid var(--border); }
        .card-title { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
        .card-value { font-size: 1.8rem; font-weight: 700; color: var(--text-main); }
        .card-subtext { font-size: 0.85rem; color: var(--accent); margin-top: 0.5rem; }
        .disclaimer { max-width: 1000px; width: 100%; font-size: 0.85rem; color: var(--text-muted); margin-top: 1.5rem; text-align: center; display: none; padding: 0.5rem; }
        .nav-link { margin-top: 3rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    </style>
</head>
<body>

<header>
    <h1 id="page-title">Annual Economic Audit</h1>
    <p style="color: var(--text-muted);">Macro Perspective: GDP & Trade Balance</p>
</header>

<div class="controls">
    <label for="year-select">Select Audit Year:</label>
    <select id="year-select" onchange="updateDashboard(this.value)"></select>
</div>

<div class="grid">
    <div class="card">
        <div class="card-title">Nominal GDP</div>
        <div id="gdp-val" class="card-value">--</div>
        <div id="gdp-growth" class="card-subtext">Annual Real Change: --</div>
    </div>
    <div class="card">
        <div class="card-title">Trade Balance (Total)</div>
        <div id="trade-val" class="card-value">--</div>
        <div id="trade-breakdown" class="card-subtext">--</div>
    </div>
</div>

<div id="annualization-disclaimer" class="disclaimer"></div>

<a href="index.htm" class="nav-link">← BACK TO MONTHLY DASHBOARD</a>

<script>
    let annualData = [];
    const percentFormat = new Intl.NumberFormat('en-US', { style: 'percent', minimumFractionDigits: 1 });

    async function init() {
        try {
            // Path corrected to pull directly from the repository root directory
            const response = await fetch('annual_data.json?v=' + new Date().getTime());
            annualData = await response.json();
            const selector = document.getElementById('year-select');
            
            // Filter dropdown to 2009+; 2008 remains in array for calculations
            const displayData = annualData.filter(row => parseInt(row.year) >= 2009);
            
            displayData.forEach(row => {
                const opt = document.createElement('option');
                opt.value = row.year;
                opt.textContent = row.year;
                selector.appendChild(opt);
            });

            if (displayData.length > 0) updateDashboard(displayData[0].year);
        } catch (e) { console.error("Load Error:", e); }
    }

    function updateDashboard(selectedYear) {
        // Find the index of the object matching the selected year
        const idx = annualData.findIndex(row => row.year === selectedYear);
        if (idx === -1) return;

        const current = annualData[idx];
        const currentRealYear = new Date().getFullYear().toString();

        // 1. Title Header & Dynamic Tooltip Visibility
        const titleElement = document.getElementById('page-title'); 
        const disclaimerDiv = document.getElementById('annualization-disclaimer');

        if (current.year === currentRealYear) {
            titleElement.textContent = current.year + " (YTD) Annual Economic Audit";
            disclaimerDiv.textContent = `Note: ${current.year} components are linearly annualized from raw YTD datasets to match seasonally adjusted aggregate series run-rates.`;
            disclaimerDiv.style.display = 'block';
        } else {
            titleElement.textContent = current.year + " Annual Economic Audit";
            disclaimerDiv.style.display = 'none';
        }

        // 2. Render Nominal GDP Level Scale Label
        const gdpVal = current.gdp_nominal >= 1000 ? 
            "$" + (current.gdp_nominal / 1000).toFixed(2) + " Trillion" : 
            "$" + current.gdp_nominal.toLocaleString() + " Billion";
        document.getElementById('gdp-val').textContent = gdpVal;

        // 3. Render Real Headline Growth Change Rate
        document.getElementById('gdp-growth').textContent = "Annual Real Change: " + percentFormat.format(current.gdp_growth_real);

        // 4. Trade Balance Matrix Mapping
        const total = current.trade_total;
        const goods = current.trade_goods;
        const services = current.trade_services;

        document.getElementById('trade-val').textContent = (total < 0 ? "-$" : "$") + Math.abs(total).toLocaleString() + " Billion";
        
        const formatSub = (val) => (val < 0 ? "-$" : "+$") + Math.abs(val).toLocaleString() + "B";
        
        document.getElementById('trade-breakdown').innerHTML = 
            `Goods: <span style="color:${goods < 0 ? '#f87171' : '#4ade80'}">${formatSub(goods)}</span> | ` +
            `Services: <span style="color:${services < 0 ? '#f87171' : '#4ade80'}">${formatSub(services)}</span>`;
    }

    init();
</script>
</body>
</html>
