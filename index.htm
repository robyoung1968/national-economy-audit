<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>National Economy Audit | Monthly Pulse</title>
    <style>
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container { width: 90%; max-width: 1100px; text-align: center; }
        h1 { font-weight: 200; letter-spacing: 4px; margin-bottom: 50px; color: #58a6ff; text-transform: uppercase; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 20px; 
        }
        
        .card { 
            background: #111111; 
            border: 1px solid #222222; 
            padding: 40px 20px; 
            border-radius: 4px;
        }
        
        .label { color: #888; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }
        .value { font-size: 2.5rem; font-weight: 700; font-family: "Courier New", monospace; color: #ffffff; }
        .subtext { color: #444; font-size: 0.7rem; margin-top: 15px; }

        .nav-link { 
            display: inline-block;
            margin-top: 60px; 
            padding: 10px 20px;
            border: 1px solid #333;
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            border-radius: 20px;
            transition: 0.3s;
        }
        .nav-link:hover { color: #fff; border-color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Monthly Pulse</h1>
        
        <div class="grid" id="kpi-grid">
            </div>

        <div>
            <a href="annual.html" class="nav-link">VIEW ANNUAL AUDIT (GDP & TRADE) →</a>
        </div>
    </div>

    <script>
        function format(val, type) {
            if (type === 'currency') return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);
            if (type === 'percent') return val.toFixed(1) + '%';
            return val.toLocaleString();
        }

        async function init() {
            try {
                const res = await fetch('economic_data.json');
                const data = await res.json();
                const grid = document.getElementById('kpi-grid');
                
                grid.innerHTML = data.metrics.map(m => `
                    <div class="card">
                        <div class="label">${m.label}</div>
                        <div class="value">${format(m.value, m.type)}</div>
                        <div class="subtext">${m.sub}</div>
                    </div>
                `).join('');
            } catch (e) {
                console.error("Dashboard Render Error:", e);
                document.getElementById('kpi-grid').innerHTML = "<p style='color:#444'>Syncing Latest Audit Data...</p>";
            }
        }
        init();
    </script>
</body>
</html>
